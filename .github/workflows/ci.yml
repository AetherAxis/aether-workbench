name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aether-workbench
      # DAG 最底层：零工作区仓依赖（仅 UI 平台第三方包）——无须兄弟仓 checkout
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Packages 私有源凭据（GITHUB_TOKEN 只写进 CI 运行时文件，不入库）。
      - name: Configure GitHub Packages credentials
        run: >
          dotnet nuget update source github
          --configfile aether-workbench/nuget.config
          --username AetherAxis
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text

      # 无测试项目（多 App 布局引擎——验收靠 Desktop 等消费者实跑）；
      # CI 只钉 Release 构建，不伪造测试通过状态。
      - name: Build
        run: dotnet build aether-workbench.slnx -c Release
        working-directory: aether-workbench
