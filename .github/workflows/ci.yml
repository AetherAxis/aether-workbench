name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aether-workbench
      # DAG 最底层：零工作区仓依赖（仅 UI 平台第三方包）——无须兄弟仓 checkout
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 不配 GitHub Packages 凭据：本仓零兄弟仓依赖、无 Aether.*/Ctp.* 包从该源拉取。
      - name: Build
        run: dotnet build aether-workbench.slnx -c Release
        working-directory: aether-workbench

      # 纯逻辑面（无窗口、无 UI 线程）：布局树多态往返 + 布局档版本信封（新档/旧裸档/未来版本/坏档）
      # + 主题 JSON 解析与内置清单 + 视图注册表 + 区域管理器两条硬规则（Register 不碰 Content、
      # key 未注册不改内容）。真实渲染（WorkspaceView 建面板/GridSplitter/换肤）仍靠 Desktop 实跑验收。
      - name: Test
        run: dotnet test aether-workbench.slnx -c Release --no-build
        working-directory: aether-workbench
